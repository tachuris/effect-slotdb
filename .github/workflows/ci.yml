name: CI

on:
  pull_request:
  push:
    tags: ['**', '!v*']
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `vp run arch` runs dependency-cruiser through bunx.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp check
      - run: vp test
      - run: vp run arch
      - run: vp run build
      - run: vp run check:consumer
